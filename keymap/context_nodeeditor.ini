# maya node editor

[DEFAULT]
enabled = true
context = nodeEditorPanel

[NodeEditorToggleNodeSelectedPins]
key = 5
note = toggle current selection, same binding as Parent

[NodeEditorShowCustomAttrs]
enabled = false
#TODO

[NodeEditorToggleNodeTitleMode]
enabled = false
#TODO

[NodeEditorCopy]
keys = ctrl+c
note = same bind as CopySelected

[NodeEditorPaste]
keys = ctrl+.
note = same bind as PasteSelected

[NodeEditorCut]
keys = ctrl+'
note = same bind as CutSelected

[NodeEditorPickWalkRight]
keys = right

[NodeEditorPickWalkLeft]
keys = left

[NodeEditorPickWalkUp]
keys = up

[NodeEditorPickWalkDown]
keys = down
