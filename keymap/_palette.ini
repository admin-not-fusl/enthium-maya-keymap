# popup command shelf

[Modeling]
Extrude = PolyExtrude
Bevel = PolyBevel
Bridge = PolyBridge
Multi-Cut = MultiCutTool
Merge Verts = PolyMergeVertices

[Cleanup]
Delete History = DeleteHistory
Freeze = FreezeTransformations
Center Pivot = CenterPivot
Combine = CombinePolygons
Separate = SeparatePolygon

[Modeling2]
Extrude = PolyExtrude | | Extr
Bevel = PolyBevel | | Bevel
Merge Vertices = PolyMergeVertices | polyMerge.png | Merge

[Scene2]
New Child = py:... | | Child
Export Selection = ExportSelection | | Export

[Scene]
New Child = py:import maya.cmds as c; s=c.ls(sl=True); g=c.group(em=True); c.parent(g,s[0]) if s else None
Export Selection = ExportSelection

[Views]
Persp = cam:persp
Top = cam:top
Front = cam:front
Side = cam:side
Maximize = pop:
Quad = layout:Four View
Single = layout:Single Perspective View
